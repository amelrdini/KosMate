version: '3.8'

services:

  backend:
    build: .
    container_name: kosmate-api

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: ${DATABASE_URL}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: kosmate-web

    ports:
      - "3001:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

    depends_on:
      - backend